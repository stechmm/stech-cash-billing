services:
  - type: web
    name: stech-cash-billing
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: stech-cash-billing-data
      mountPath: /var/data
      sizeGB: 1
